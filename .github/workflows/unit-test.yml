name: Unit Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run install.sh unit test
        id: run-install-sh-unit-test
        background: true
        run: bash tests/unit/test_install.sh

      - name: Run tmux selector ordering unit test
        id: run-tmux-selector-order-unit-test
        background: true
        run: bash tests/unit/test_tmux_selector_order.sh

      - name: Run update.sh unit test
        id: run-update-sh-unit-test
        background: true
        run: bash tests/unit/test_update.sh

      - name: Run AI alias unit test
        id: run-ai-alias-unit-test
        background: true
        run: bash tests/unit/test_ai_alias.sh

      - name: Run Chrome MCP unit test
        id: run-chrome-mcp-unit-test
        background: true
        run: bash tests/unit/test_chrome_mcp.sh

      - name: Run notification unit test
        id: run-notification-unit-test
        background: true
        run: bash tests/unit/test_notifications.sh

      - name: Run hooks unit test
        id: run-hooks-unit-test
        background: true
        run: bash tests/unit/test_hooks.sh

      - name: Run deep-review ledger unit test
        id: run-deep-review-ledger-unit-test
        background: true
        run: bash tests/unit/test_deep_review_ledger.sh

      - name: Run deep-review layout unit test
        id: run-deep-review-layout-unit-test
        background: true
        run: bash tests/unit/test_deep_review_layout.sh

      - name: Run deep-review comment unit test
        id: run-deep-review-comment-unit-test
        background: true
        run: bash tests/unit/test_deep_review_comment.sh

      - name: Run powerline daemon launch unit test
        id: run-powerline-daemon-launch-unit-test
        background: true
        run: bash tests/unit/test_powerline_daemon_launch.sh

      - name: Run PR monitor unit test
        id: run-pr-monitor-unit-test
        background: true
        run: bash tests/unit/test_pr_monitor.sh

      - name: Run PR watch events unit test
        id: run-pr-watch-events-unit-test
        background: true
        run: bash tests/unit/test_pr_watch_events.sh

      - name: Run trilium validation unit test
        id: run-trilium-validation-unit-test
        background: true
        run: bash tests/unit/test_trilium_validation.sh

      - name: Run tmux selector preview unit test
        id: run-tmux-selector-preview-unit-test
        background: true
        run: bash tests/unit/test_tmux_selector_preview.sh

      - name: Run language policy unit test
        id: run-language-policy-unit-test
        background: true
        run: bash tests/unit/test_language_policy.sh

      - name: Run list-compose-dirs unit test
        id: run-list-compose-dirs-unit-test
        background: true
        run: bash tests/unit/test_list_compose_dirs.sh

      - name: Run deep-review measure-usage unit test
        id: run-measure-usage-unit-test
        background: true
        run: bash tests/unit/test_measure_usage.sh

      - name: Run write-session-state unit test
        id: run-write-session-state-unit-test
        background: true
        run: bash tests/unit/test_write_session_state.sh

      - name: Run rtk hook hash unit test
        id: run-rtk-hook-hash-unit-test
        background: true
        run: bash tests/unit/test_rtk_hook_hash.sh

      - name: Wait for unit tests
        wait:
          - run-install-sh-unit-test
          - run-tmux-selector-order-unit-test
          - run-update-sh-unit-test
          - run-ai-alias-unit-test
          - run-chrome-mcp-unit-test
          - run-notification-unit-test
          - run-hooks-unit-test
          - run-deep-review-ledger-unit-test
          - run-deep-review-comment-unit-test
          - run-powerline-daemon-launch-unit-test
          - run-pr-monitor-unit-test
          - run-pr-watch-events-unit-test
          - run-trilium-validation-unit-test
          - run-tmux-selector-preview-unit-test
          - run-language-policy-unit-test
          - run-list-compose-dirs-unit-test
          - run-measure-usage-unit-test
          - run-write-session-state-unit-test
          - run-rtk-hook-hash-unit-test
