name: Integration Test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  integration-test:
    name: Test chezmoi apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run chezmoi integration test
        run: bash tests/integration/test_chezmoi_apply.sh

      - name: Run gitleaks regression test
        run: bash tests/integration/test_gitleaks.sh

      - name: Run mise CLI smoke test
        run: bash tests/integration/test_mise_tools.sh

      # tmux 未導入だとテストが SKIP (exit 0) して素通りするため、先に導入する
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run PR monitor tmux integration test
        run: bash tests/integration/test_pr_monitor_tmux.sh

  docker-integration-test:
    name: Test chezmoi apply in Docker
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run integration test in container
        run: bash tests/integration/test_chezmoi_apply.sh
