name: PR Checks

on:
  pull_request:
    branches:
      - master

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run shellcheck with action
        id: run-shellcheck-with-action
        background: true
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          path: |
            .
          pattern: |
            *.sh
            **/executable_*
          exclude: |
            ./.bare/**
            ./bin/**
          shellcheck_flags: '-s bash'

      - name: Run custom shellcheck tests
        id: run-custom-shellcheck-tests
        background: true
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          bash tests/syntax/test_shellcheck.sh

      - name: Wait for shellcheck steps
        wait:
          - run-shellcheck-with-action
          - run-custom-shellcheck-tests

  syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check bash syntax
        run: bash tests/syntax/test_bash_syntax.sh

  json-schema:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Run JSON Schema validation
        run: bash tests/syntax/test_json_schema.sh

  chezmoi-verify:
    name: Chezmoi Configuration Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install chezmoi
        run: |
          curl -sfL https://git.io/chezmoi | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Verify chezmoi apply dry-run
        run: |
          export HOME=$(mktemp -d)
          export XDG_CONFIG_HOME="$HOME/.config"
          SOURCE_DIR="$(pwd)"
          chezmoi init --source="$SOURCE_DIR"
          chezmoi apply --dry-run --source="$SOURCE_DIR"
