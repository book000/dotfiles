{{- /* chezmoi:modify-template */ -}}
{{- $config := dict -}}
{{- if hasKey .chezmoi "stdin" -}}
{{- $config = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- $config = $config | setValueAtPath "web_search" "live" -}}
{{- $config = $config | setValueAtPath "model_reasoning_summary" "auto" -}}
{{- $config = $config | setValueAtPath "project_doc_fallback_filenames" (list "AGENTS.local.md") -}}
{{- $config = $config | setValueAtPath "notify" (list "codex-wakatime") -}}
{{- $config = $config | setValueAtPath "sandbox_workspace_write.network_access" true -}}
{{- $config = $config | setValueAtPath "suppress_unstable_features_warning" true -}}
{{- $config = $config | setValueAtPath "features.hooks" true -}}
{{- $_ := unset (index $config "features") "codex_hooks" -}}
{{- $config = $config | setValueAtPath "features.unified_exec" true -}}
{{- $config = $config | setValueAtPath "features.shell_snapshot" true -}}
{{- $config = $config | setValueAtPath "features.default_mode_request_user_input" true -}}
{{- $config = $config | setValueAtPath "shell_environment_policy.set.BASH_ENV" (printf "%s/.bash_env" .chezmoi.homeDir) -}}
{{- /* Codex hook trust is keyed by source path + event/group/handler index. Pin the
      managed global PreToolUse identity so a targeted hooks.json deploy does not stop
      Codex runtimes at the interactive Hook Review screen. */ -}}
{{- $hooks := dict -}}
{{- if hasKey $config "hooks" -}}{{- $hooks = index $config "hooks" -}}{{- end -}}
{{- $hookState := dict -}}
{{- if hasKey $hooks "state" -}}{{- $hookState = index $hooks "state" -}}{{- end -}}
{{- $gitGuardKey := printf "%s/.codex/hooks.json:pre_tool_use:0:0" .chezmoi.homeDir -}}
{{- $gitGuardState := dict -}}
{{- if hasKey $hookState $gitGuardKey -}}{{- $gitGuardState = index $hookState $gitGuardKey -}}{{- end -}}
{{- $_ := set $gitGuardState "trusted_hash" "sha256:5be52eb577c8c54cec54e7635c1fb9ad3fa4166798f3652f0444a50a5fadf979" -}}
{{- $_ = set $hookState $gitGuardKey $gitGuardState -}}
{{- $_ = set $hooks "state" $hookState -}}
{{- $_ = set $config "hooks" $hooks -}}
{{- $config | toToml -}}
